name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check tag matches manifest version
        run: |
          version=$(jq -r .version manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version"
            exit 1
          fi

      - run: npx --yes web-ext@10 lint

      - run: npx --yes web-ext@10 build

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" web-ext-artifacts/*.zip --title "Rezumer $GITHUB_REF_NAME" --generate-notes
