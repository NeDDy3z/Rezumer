<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=320">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main id="detail" hidden>
    <div class="header">
      <button id="clear" class="icon" title="Clear">
        <svg viewBox="0 0 16 16"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 6.5v4.5M9.2 6.5v4.5"/></svg>
      </button>
      <button id="show-list" class="icon push-right" title="All watched">
        <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
      </button>
      <button class="icon show-settings" title="Settings">
        <svg viewBox="0 0 16 16"><path d="M8.00 2.60 L9.37 1.13 L10.68 1.53 L11.00 3.51 L11.82 4.18 L13.82 4.11 L14.47 5.32 L13.30 6.95 L13.40 8.00 L14.87 9.37 L14.47 10.68 L12.49 11.00 L11.82 11.82 L11.89 13.82 L10.68 14.47 L9.05 13.30 L8.00 13.40 L6.63 14.87 L5.32 14.47 L5.00 12.49 L4.18 11.82 L2.18 11.89 L1.53 10.68 L2.70 9.05 L2.60 8.00 L1.13 6.63 L1.53 5.32 L3.51 5.00 L4.18 4.18 L4.11 2.18 L5.32 1.53 L6.95 2.70Z"/><circle cx="8" cy="8" r="2"/></svg>
      </button>
    </div>
    <div class="row">
      <div class="info">
        <h1 id="title"></h1>
        <p id="player" class="muted"></p>
      </div>
      <span id="time"></span>
    </div>
    <button id="resume" hidden>Resume</button>
  </main>

  <main id="list" hidden>
    <div class="header controls">
      <button id="list-back" class="icon" title="Back" hidden>
        <svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg>
      </button>
      <input id="search" type="search" placeholder="Search">
      <select id="sort">
        <option value="newest">Newest</option>
        <option value="oldest">Oldest</option>
        <option value="az">A-Z</option>
        <option value="za">Z-A</option>
      </select>
      <button class="icon show-settings" title="Settings">
        <svg viewBox="0 0 16 16"><path d="M8.00 2.60 L9.37 1.13 L10.68 1.53 L11.00 3.51 L11.82 4.18 L13.82 4.11 L14.47 5.32 L13.30 6.95 L13.40 8.00 L14.87 9.37 L14.47 10.68 L12.49 11.00 L11.82 11.82 L11.89 13.82 L10.68 14.47 L9.05 13.30 L8.00 13.40 L6.63 14.87 L5.32 14.47 L5.00 12.49 L4.18 11.82 L2.18 11.89 L1.53 10.68 L2.70 9.05 L2.60 8.00 L1.13 6.63 L1.53 5.32 L3.51 5.00 L4.18 4.18 L4.11 2.18 L5.32 1.53 L6.95 2.70Z"/><circle cx="8" cy="8" r="2"/></svg>
      </button>
    </div>
    <ul id="entries"></ul>
    <p id="empty" class="muted" hidden>Nothing watched yet.</p>
  </main>

  <main id="settings" hidden>
    <div class="header">
      <button id="back" class="icon" title="Back">
        <svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg>
      </button>
      <h1>Settings</h1>
    </div>

    <div id="permission" class="status">
      <span class="dot"></span>
      <p id="permission-text"></p>
      <button id="grant" class="small" hidden>Grant</button>
    </div>

    <div class="setting disabled">
      <div class="info">
        <h2>Sync with cloud</h2>
        <p class="muted">Coming soon</p>
      </div>
      <input type="checkbox" class="switch" disabled>
    </div>

    <footer>
      <h2>About</h2>
      <p class="muted">Rezumer <span id="version"></span>. Remembers how far you got in a video.</p>
      <a id="repo" href="#">GitHub repository</a>
    </footer>
  </main>

  <template id="entry-template">
    <li>
      <div class="info">
        <h2></h2>
        <p class="muted"></p>
      </div>
      <button class="icon play" title="Open">
        <svg viewBox="0 0 16 16"><path d="M5 3l8 5-8 5z" class="filled"/></svg>
      </button>
      <button class="icon delete" title="Delete">
        <svg viewBox="0 0 16 16"><path d="M2.5 4h11M6 4V2.5h4V4M4 4l.7 9.5h6.6L12 4M6.8 6.5v4.5M9.2 6.5v4.5"/></svg>
      </button>
    </li>
  </template>

  <script src="sites.js"></script>
  <script src="popup.js"></script>
</body>
</html>
